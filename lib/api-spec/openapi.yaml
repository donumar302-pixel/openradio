openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Voiceover Tool API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: admin
    description: Admin operations
  - name: voices
    description: ElevenLabs voices
  - name: tts
    description: Text to speech
  - name: generations
    description: Generation history
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /admin/keys:
    get:
      operationId: listApiKeys
      tags: [admin]
      summary: List all API keys
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiKey"
    post:
      operationId: createApiKey
      tags: [admin]
      summary: Add a new ElevenLabs API key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiKeyInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKey"

  /admin/keys/{id}:
    patch:
      operationId: updateApiKey
      tags: [admin]
      summary: Update an API key
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiKeyUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKey"
    delete:
      operationId: deleteApiKey
      tags: [admin]
      summary: Delete an API key
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /admin/stats:
    get:
      operationId: getAdminStats
      tags: [admin]
      summary: Admin dashboard stats
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStats"

  /voices:
    get:
      operationId: listVoices
      tags: [voices]
      summary: List available ElevenLabs voices
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Voice"

  /tts:
    post:
      operationId: generateSpeech
      tags: [tts]
      summary: Generate speech from text
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TtsInput"
      responses:
        "200":
          description: Audio file URL and generation record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TtsResult"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: No active API keys
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /generations:
    get:
      operationId: listGenerations
      tags: [generations]
      summary: List generation history
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerationList"

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    ApiKey:
      type: object
      required: [id, label, keyPreview, isActive, usageCount, createdAt]
      properties:
        id:
          type: integer
        label:
          type: string
        keyPreview:
          type: string
          description: Masked key e.g. "sk-...abc"
        isActive:
          type: boolean
        usageCount:
          type: integer
        lastUsedAt:
          type: ["string", "null"]
        createdAt:
          type: string

    ApiKeyInput:
      type: object
      required: [label, key]
      properties:
        label:
          type: string
          minLength: 1
        key:
          type: string
          minLength: 1

    ApiKeyUpdate:
      type: object
      properties:
        label:
          type: string
        isActive:
          type: boolean

    AdminStats:
      type: object
      required: [totalKeys, activeKeys, totalGenerations, totalCharacters]
      properties:
        totalKeys:
          type: integer
        activeKeys:
          type: integer
        totalGenerations:
          type: integer
        totalCharacters:
          type: integer

    Voice:
      type: object
      required: [voiceId, name, category]
      properties:
        voiceId:
          type: string
        name:
          type: string
        category:
          type: string
        description:
          type: ["string", "null"]
        previewUrl:
          type: ["string", "null"]

    TtsInput:
      type: object
      required: [text, voiceId]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 5000
        voiceId:
          type: string
        stability:
          type: number
          minimum: 0
          maximum: 1
        similarityBoost:
          type: number
          minimum: 0
          maximum: 1
        modelId:
          type: string

    TtsResult:
      type: object
      required: [generationId, audioUrl, characterCount]
      properties:
        generationId:
          type: integer
        audioUrl:
          type: string
        characterCount:
          type: integer

    Generation:
      type: object
      required: [id, text, voiceId, voiceName, characterCount, audioUrl, createdAt]
      properties:
        id:
          type: integer
        text:
          type: string
        voiceId:
          type: string
        voiceName:
          type: string
        characterCount:
          type: integer
        audioUrl:
          type: string
        modelId:
          type: ["string", "null"]
        createdAt:
          type: string

    GenerationList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Generation"
        total:
          type: integer

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
