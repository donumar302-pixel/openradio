[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = ["npm install -g pnpm@9", "cd ../.. && pnpm install --frozen-lockfile"]

[phases.build]
cmds = ["cd ../.. && pnpm --filter @workspace/api-server run build"]

[start]
cmd = "node --enable-source-maps /app/artifacts/api-server/dist/index.mjs"
